# Minimal config for law_question_generator.py
# Input: put the unzipped .docx folders here (list format)
input_dirs:
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/금융법령"
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/기업법령"
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/보험법령"
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/상법투자자산증권주식법령"
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/은행법령"
  - "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/조합법령"

# Output Excel path (will be created/overwritten)
output_excel: "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/법령문제_법조문포함.xlsx"

# Resume state file (JSON)
processed_state: "C:/ai_x/source/Project2nd/금융법령수집/금융문제수집/법령문제_법조문포함_state.json"

# OpenAI model & generation controls
model: "gpt-4o-mini"
temperature: 0.2
seed: 42
per_law_target: 30
mcq_ratio: 0.75

# Difficulty distribution (원본 설정 유지)
difficulty_high: 0.5
difficulty_mid: 0.4
difficulty_low: 0.1

# Cross-law comparative question probability per law
crosslaw_ratio: 0.10

# Batching controls
batch_size: 10
flush_every_batches: 1

# Runtime settings
resume: true
max_retries: 3
request_timeout: 120
include_explanations: true

# Additional quality controls (optional)
max_chunk_size: 12000      # 텍스트 청크 최대 크기

# 25문항 고정, 모든 문제 해결
per_law_target: 25
parallel_chunks: false
enforce_ratios: true
atomic_saves: true
timeout_stages: [60, 90, 150]
max_retries_per_stage: 2
max_workers: 6
save_frequency: 3

