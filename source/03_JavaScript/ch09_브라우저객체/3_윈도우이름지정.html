<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <script>
        const openWin = function(){
            // ch_win이라는 이름의 새창을 열기
            var ch = open('', 'ch_win', 'width=700, height=500');
            if(!ch){
                alert('팝업 해제 요청');
            }
        }
    </script>
</head>
<body>
    <button onclick="openWin()">새창열기</button>
    <br>
    <a href="http://www.daum.net" target="ch_win">다음</a>
</body>
</html>
