<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        let i = 10;
        document.write('i='+i+'<br>');
        i =  20;
        document.write('i='+i+'<br>');
        // 익명함수는 함수 정의 후에 호출(사용)이 가능능
        let funcVar = function(i, j){
            alert('함수 표현식 test i='+i+', j='+j);
        }; // 익명함수의 정의
        funcVar(100,200);
        funcVar = (i, j) => { // 함수 재정의 후 호출시, 재정의된 함수로 실행행
            alert('화살표 함수 test i='+i)
        };
        funcVar(99,9);
    </script>
</head>
