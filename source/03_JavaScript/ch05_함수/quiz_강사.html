<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>   
        body{
            background-image: url('ch05_img/img03.png');
            background-size: 100%;
            color: yellow;
            font-size: 3em;
        }
    </style>
    <script>
        /*힌트 : 배열 이용하면 소스가 효율적 */
        let tictactoc = 0;
        let textColor = ['yellow', 'white', 'green'];
        let bg_img = ['url(ch05_img/img01.png)',
                    'url(ch05_img/img02.png)',
                    'url(ch05_img/img03.png)']

        document.writeln(new Date().toLocaleString());

        // 1000밀리세컨드 마다 콜백함수 수행
        var timerId = setInterval(() => {
            document.body.innerHTML = new Date().toLocaleString();
            tictactoc++;
            document.body.innerHTML += '<p>' + tictactoc + '초 지남</p>';

            document.body.style.backgroundImage = bg_img[tictactoc%bg_img.length];
            document.body.style.color = textColor[tictactoc%bg_img.length];
        }, 1000);
        // 일정시간(10초) 후, 타이머(id) 중지
        setTimeout(()=>{
            clearInterval(timerId);
        }, 10000);
    </script>
</head>
<body>

</body>
</html>
