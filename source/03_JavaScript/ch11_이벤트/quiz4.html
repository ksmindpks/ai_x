<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        div{width:300px; margin:0 auto; border:1px solid blue; text-align:center; padding: 10px;}
    </style>
    <script>
        let snsS = ['https://www.naver.com','https://www.daum.net',
                    'https://www.google.com','https://www.youtube.com']
        window.onload = ()=>{
            const btns =  document.getElementsByTagName('button');
            for(let idx=0 ; idx<btns.length ; idx++){
                btns[idx].onclick = function(){
                    location.href = snsS[idx];
                };
            }
        };
    </script>
</head>
<body>
    <div>
        <h3>quiz4. 메뉴</h3>
        <p>
            <button name="sns">네이버</button>
            <button name="sns">다음</button>
            <button name="sns">구글</button>
            <button name="sns">유투버</button>
        </p>
    </div>
</body>
</html>
