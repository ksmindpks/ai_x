<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        table {width:280px; height: 100px; margin: 10px auto;} h3{text-align:center;}
    </style>

    <script>
        var color7P = ['red','orange','yellow','green','blue','navy','violet', 'white'];
        window.onload = ()=>{
            // let tds = document.getElementsByTagName('td');
            let tds = document.querySelectorAll('td');
            for(idx=0; idx<tds.length; idx++){
                // tds[idx].style.backgroundColor = color7P[idx];
                tds[idx].style = 'background-color:' + color7P[idx];
            }
        };
        const bgColorChange = n => document.body.style.backgroundColor = color7P[n];
    </script>
</head>
<body>
    <h3>quiz1: 마우스를 올리면 바탕화면도 해당 색상으로</h3>
    <table>
        <tr onmouseout="bgColorChange(7)">
            <td onmouseover="bgColorChange(0)"></td>
            <td onmouseover="bgColorChange(1)"></td>
            <td onmouseover="bgColorChange(2)"></td>
            <td onmouseover="bgColorChange(3)"></td>
            <td onmouseover="bgColorChange(4)"></td>
            <td onmouseover="bgColorChange(5)"></td>
            <td onmouseover="bgColorChange(6)"></td>
        </tr>
    </table>
</body>
</html>
