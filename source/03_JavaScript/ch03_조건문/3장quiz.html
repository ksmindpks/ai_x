<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        form{
            width: 300px; height: 110px ; 
            border: 1px solid gray; margin: 0 auto}
        td{
            width: 40%; height: 30px; 
            text-align: center; }
    </style>
    <script>
        var result;
        function chk(){
            gap = parseInt(frm.id1.value) - parseInt(frm.id2.value);
            dec = gap >= 0 ? 1 : -1;
            document.write(gap, dec);
            switch(dec){
                case 1: result = '첫번째 수가'; break;
                case -1: result = '두번째 수가'; break;
                default: 
            }
            alert(result+gap+'더 큽니다');
        }

        window.onload = function chk(){
            document.body.innerHTML += result;
        }
        
    </script>
</head>
<body>
    <form name="frm" onsubmit="return chk()">
        <table>
            <tr>
                <td>첫번째수</td>
                <td><input type="number" name="id1"></td>
            </tr>
            <tr>
                <td>두번째수</td>
                <td><input type="number" name="id2"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="결과"></td>
            </tr>
        </table>
    </form>
</body>
</html>
