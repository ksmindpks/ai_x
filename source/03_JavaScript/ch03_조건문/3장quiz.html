<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
        fieldset{width: 300px;}
        p{text-align: center;}
    </style>
    <script>
        var result;
        function chk(){
            gap = parseInt(frm.id1.value) - parseInt(frm.id2.value);
            dec = gap >= 0 ? 1 : -1;
            document.write(gap, dec);
            switch(dec){
                case 1: result = '첫번째 수가'; break;
                case -1: result = '두번째 수가'; break;
                default: 
            }
            alert(result+gap+'더 큽니다');
        }

        window.onload = function chk(){
            document.body.innerHTML += result;
        }
        
    </script>
</head>
<body>
    <form name="frm" onsubmit="return chk()">
        <fieldset>
            <p>
                <label for="id1">첫번째 수</label>
                <input type="number" name="id1" id="id1">
            </p>
            <p>
                <label for="id2">두번째 수</label>
                <input type="number" name="id2" id="id2">
            </p>
            <p>
                <input type="submit" value="결과">
            </p>
        </fieldset>
    </form>
</body>
</html>
