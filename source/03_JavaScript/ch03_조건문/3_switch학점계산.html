<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        // 점수를 입력받아 grade(A,B,C,D,F)을 출력
        // Math.round(변수) : 반올림
        // Math.trunc(변수) : 내림림
        let score = parseInt(prompt('점수는?'));
        let temp = score == 100 ? (score-1) : (score>=-9 && score<=-1 ? -10 : score);
        switch(Math.trunc(temp/10)){
            case 9: grade = 'A'; break;
            case 8: grade = 'B'; break;
            case 7: grade = 'C'; break;
            case 6: grade = 'D'; break;
            case 5: case 4: case 3: case 2: case 1: case 0: grade = 'F'; break;
            default: grade = '유효하지 않은 ';
        }
        document.write(grade + '학점입니다', Math.trunc(temp/10));

    </script>
</head>

</body>
</html>
