<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div{
            border:1px solid gray;
        }
        #header, #footer{ /* id 선택자 :id 앞에는 # */
            width:600px;
            margin:0 auto;
            background-color:yellow;
            text-align:center;
        }
        #wrap {
            width: 600px;
            margin: 0 auto;
            overflow: hidden;
            background-color: aqua;
            text-align: center;
        }
        #wrap #content{
            width: 348px; /* #content 영역 = 348+2*/
            height:300px;
            float: left; /* 수평으로 */
        }
        #wrap #content .odd{
            font-size: 1.5em; /* 글씨 크기를 원래의 1.5배 */
        }
        #wrap #content .menu1,
        #wrap #content .menu2{
            font-weight:bold; /* 글씨 진하게*/
        }
        #wrap #banner {
            width: 248px; /* #banner 영역 = 248+2(boder)*/
            height: 300px;
            float: left; /* 수평으로 */
        }
        #wrap #banner img{ width:100px;}
    </style>
</head>
<body>
    <div id="header">
        <h1>HEADER</h1>
    </div>
    <div id="wrap">
        <div id="content">
            <h2>content</h2>
            <ul>
                <li class="menu1 odd">menu1</li>
                <li class="menu2">menu2</liclass="menu1>
                <li class="menu3 odd">menu3</li>
                <li class="menu4">menu4</li>
                <li class="menu5 odd">menu5</li>
            </ul>
        </div>
        <div id="banner">
            <h2>BANNER</h2>
            <img src="ch04/sulhyun.jpg" />
            <img src="https://search4.kakaocdn.net/argon/656x0_80_wr/5UzWzKRwdOu"
                 width="248"
                 height="248" />
        </div>
    </div>
    <div id="footer">
        <h1>FOOTER</h1>
    </div>
</body>
</html>
