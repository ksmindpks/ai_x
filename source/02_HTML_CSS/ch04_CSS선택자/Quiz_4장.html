<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        /* 전체 layout 잡기 */
        #header, #content, #footer{
            width:1000px; margin:0 auto; overflow:hidden;
        }
        .left, .right{
            float:left; width:150px; height:150px; background-color:lightgray; border: 1px solid gray;
        }
        .center{
            float:left; width:693px; height:150px; background-color:lightgray; border:1px solid gray;
        }
        #content > div{height:300px;}

        #header .left{border-radius:30px 0 30px 0;}
        #header .center{border-radius:0 0 30px 30px;}
        #header .right{border-radius:0 30px 0 30px;}
        #content .left{border-radius:0 30px 30px 0;}
        #content .center{border-radius:30px 30px 30px 30px;}
        #content .right{border-radius:30px 0 0 30px;}
        #footer .left{border-radius:0 30px 0 30px ;}
        #footer .center{border-radius:30px 30px 0 0;}
        #footer .right{border-radius:30px 0 30px 0;}

        #content .center #nav ul{overflow:hidden; padding-left:0;}
        #content .center #nav ul li{
            float: left;
            list-style: none;
            font-size: 2em;
            font-weight: bold;
            width:231px;
            text-align:center;
        }
        #content .center #nav ul li a{text-decoration: none; color: black;}
        #content .center #academy h1{text-align:center; padding:20px;}
        #content .center #academy p{padding:20px;}

        #content .right ol li:nth-child(9) ~ li{color: darkred;}
    </style>
</head>
<body>
    <div id="header">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>

    </div>
    <div id="content">
        <div class="left"></div>
        <div class="center">
            <div id="nav">
                <ul>
                    <li><a href="">menu1</a></li>
                    <li><a href="">menu2</a></li>
                    <li><a href="">menu2</a></li>
                </ul>
            </div>
            <div id="academy">
                <h1>AI개발자 양성과정</h1>
                <p>
                    연소자의 근로는 특별한 보호를 받는다. 공무원의 신분과 정치적 중립성은 법률이 정하는 바에 의하여 보장된다. 법률이 헌법에 위반되는 여부가 재판의 전제가 된 경우에는 법원은 헌법재판소에 제청하여 그 심판에 의하여 재판한다.
                </p>
            </div>
        </div>

        <div class="right">
            <ol>
                <li>태그</li>
                <li>전체(*)</li>
                <li>id,class</li>
                <li>속성</li>
                <li>후손,자손</li>
                <li>동위</li>
                <li>반응</li>
                <li>상태</li>
                <li>구조</li>
                <li>문자</li>
                <li>링크</li>
                <li>부정</li>
            </ol>
        </div>
    </div>
    <div id="footer">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>
    </div>
</body>
</html>
