<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        b{color:red;}
        header, footer {
            text-align: center; /* 글씨 가운데 정렬 */
    </style>
</head>
<body>
    <!-- 정규표현식(https://ko.wikipedia.org/wiki/정규표현식)
        ? : 0,1번 반복
        + : 1회 이상 반복
        * : 0회 이상 반복
        | : 또는
        {2,} : 2회 이상 반복
        {m,n} : m회에서 n회 사이 반복
        {n} : n회 반복
        \d, [0-9] : 숫자
        \D, 숫자가 아닌것
        \w, [a-zA-Z0-9] :영문자나 숫자
        가-힣 : 한글
        . : \n을 제외한 문자
        \. : .
        [~`!@#$%^&*()\-\\_++{}\[\];:"'<>,\.'] : 특수문자
        (ex) 전화번호 : [0-9]{2,3}-\d{3,4}-\d{4}
             email : [a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+(\.[a-zA-Z]+){1,2} or
                     [a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+\.[a-zA-Z]+(\.[a-zA-Z]+)?
        -->
    <header>
        <h1>회원가입</h1>
    </header>
    <section>
        <form>
            <fieldset>
                <legend>필수입력</legend>
                <ul>
                    <li>
                        <label for="name">이 름<b>*</b></label>
                        <input type="name" name="name" id="name"
                               placeholder="이름은 2글자 이상"
                               pattern="[a-zA-Z가-힣]{2,}"
                               title="이름 형식에 맞지 않습니다"
                               required="required"/>
                    </li>
                    <li>
                        <label for="id">아이디<b>*</b></label>
                        <input type="id" name="id" id="id"
                               placeholder="아이디는 6글자 이상"
                               pattern="[a-zA-Z]{6,9}"
                               title="아이디 형식에 맞지 않습니다"
                               required="required"/>
                    </li>
                    <li>
                        <label for="pwd">비밀번호<b>*</b></label>
                        <input type="password" name="pwd" id="pwd"
                               pattern="[a-zA-Z0-9]{4,6}"
                               required="required"
                               title="비밀번호 형식에 맞지 않습니다" />
                    </li>
                    <li>
                        <label for="pwdCk">비번확인<b>*</b></label>
                        <input type="password" name="pwdCk" id="pwdCk"
                               pattern="[a-zA-Z0-9]{4,6}"
                               required="required"
                               title="비밀번호 형식에 맞지 않습니다" />
                    </li>
                    <li>
                        <label for="tel">전화<b>*</b></label>
                        <input type="tel" name="tel" id="tel"
                               required="required"
                               placeholder="000-0000-0000/xx-xxx-xxxx"
                               pattern="[0-9]{2,3}-\d{3,4}-\d{4}"
                               title="전화번호 형식이 맞지 않습니다.(000-0000-0000/xx-xxx-xxxx)"
                               autofocus="autofocus"
                               required="required"/>
                    </li>
                    <li>
                        <label for="email">이메일<b>*</b></label>
                        <input type="email" name="email" id="email"
                               placeholder="id@domain.com 또는 co.kr"
                               pattern="[a-zA-Z0-9가-힣]+@[a-zA-Z0-9]+(\.[a-zA-Z]+){1,2}"
                               title="이메일 형식에 맞지 않습니다" 
                               required="required"/>
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <legend>추가 입력 사항</legend>
                <ul>
                    <li>
                        <label for="marriage">결혼유무 :</label>
                        <input type="radio" name="marriage" value="m" checked="checked" />기혼
                        <input type="radio" name="marriage" value="um" />미혼
                    </li>
                    <li>
                        <label for="child">자식 :</label>
                        <input type="checkbox" name="child" value="son" checked="checked" />아들
                        <input type="checkbox" name="child" value="daughter" />딸
                    </li>
                    <li>
                        <label for="region">지역 :</label>
                        <select name="region">
                            <option value="seoul">서울</option>
                            <option selected="selected">경기</option>
                            <option>인천</option>
                        </select>
                    </li>
                </ul>
            </fieldset>
            <p>
                <center>
                    <input type="submit" value="입력완료" />
                    <input type="reset" value="입력취소" />
                </center>
            </p>
        </form>
    </section>
    <footer>
        <p>서울시 서대문구 신촌로 141 은하빌딩 203호 </p>
        <p>Copyright ⓒ Joeun System Corp. All Right reserved.</p>
    </footer>
</body>
</html>
